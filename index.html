<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4844">
<title>수학도서관 오답노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오답노트">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="mark-logo" src="logo-symbol.svg" alt="수학도서관 로고"><div><strong>수학도서관 오답노트</strong><small id="academyName"></small></div></div>
  <div class="row"><button id="installBtn" class="ghost small" hidden>앱으로 설치</button><button id="logoutBtn" class="ghost small" hidden>로그아웃</button></div>
</header>
<!-- 2026-11-28: 오답노트는 수학도서관 앱으로 옮겼습니다. 입력은 새 앱에서만 합니다(기록이 두 곳으로 나뉘지 않게). 데이터(sudo-odap)는 지우지 않고 그대로 둡니다. -->
<main id="main" style="display:flex;justify-content:center;padding:48px 16px">
  <div class="card" style="max-width:560px;width:100%;text-align:center;padding:32px 24px">
    <h2 style="margin:0 0 12px">오답노트가 '수학도서관' 앱으로 옮겨졌습니다</h2>
    <p>11월 28일까지 이 앱에 넣은 학생 · 교재 · 오답 기록 · 오답노트는 모두 새 앱으로 옮겼습니다.<br>이제부터 오답 입력과 오답노트 · 유사문항은 <b>수학도서관 앱</b>에서 해 주세요.</p>
    <p style="margin:20px 0"><a class="primary" href="https://hongs-sudo.github.io/mathlib/" style="display:inline-block;padding:12px 22px;border-radius:10px;text-decoration:none">수학도서관 앱 열기</a></p>
    <p class="muted small">같은 Google 계정으로 로그인하면 됩니다. MYBOX 폴더 연결도 이 PC에 그대로 남아 있어, 새 앱에서 '다시 연결'만 한 번 누르면 됩니다.<br>설치한 '오답노트' 앱 대신 새 앱 화면에서 '앱으로 설치'를 눌러 주세요.</p>
    <p class="muted small" id="goIn"></p>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => { let n = 10; const el = document.getElementById('goIn'); const t = setInterval(() => { el.textContent = n + '초 뒤 새 앱으로 이동합니다'; if (n-- <= 0) { clearInterval(t); location.href = 'https://hongs-sudo.github.io/mathlib/'; } }, 1000); })();
</script>
<script>
// 앱 설치 (PC 크롬·엣지: 버튼 한 번 / 아이패드·아이폰: 공유 → 홈 화면에 추가)
(() => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const btn = document.getElementById('installBtn');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  const say = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 7000); };
  let ev = null;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); ev = e; btn.hidden = false; });
  addEventListener('appinstalled', () => { btn.hidden = true; say('설치했습니다. 바탕화면·시작 메뉴의 "오답노트"로 여세요.'); });
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) btn.hidden = false;
  btn.onclick = async () => {
    if (ev) { ev.prompt(); await ev.userChoice; ev = null; btn.hidden = true; }
    else if (ios) say('사파리 위쪽의 공유 버튼(□↑) → "홈 화면에 추가" → 추가를 누르세요.');
  };
})();
</script>
</body>
</html>
