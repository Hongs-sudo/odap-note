<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4844">
<title>수학도서관 오답노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오답노트">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="mark-logo" src="logo-symbol.svg" alt="수학도서관 로고"><div><strong>수학도서관 오답노트</strong><small id="academyName"></small></div></div>
  <div class="row"><button id="installBtn" class="ghost small" hidden>앱으로 설치</button><button id="logoutBtn" class="ghost small" hidden>로그아웃</button></div>
</header>
<nav id="tabs" class="tabs" hidden>
  <button data-view="books" class="on">교재 라이브러리</button>
  <button data-view="catalog">교재 정리</button>
  <button data-view="students">학생</button>
  <button data-view="settings">연결 설정</button>
</nav>
<main id="main"><p class="muted center pad">불러오는 중…</p></main>
<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
<script>
// 앱 설치 (PC 크롬·엣지: 버튼 한 번 / 아이패드·아이폰: 공유 → 홈 화면에 추가)
(() => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const btn = document.getElementById('installBtn');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  const say = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 7000); };
  let ev = null;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); ev = e; btn.hidden = false; });
  addEventListener('appinstalled', () => { btn.hidden = true; say('설치했습니다. 바탕화면·시작 메뉴의 "오답노트"로 여세요.'); });
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) btn.hidden = false;
  btn.onclick = async () => {
    if (ev) { ev.prompt(); await ev.userChoice; ev = null; btn.hidden = true; }
    else if (ios) say('사파리 위쪽의 공유 버튼(□↑) → "홈 화면에 추가" → 추가를 누르세요.');
  };
})();
</script>
</body>
</html>
